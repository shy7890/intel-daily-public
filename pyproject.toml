[project]
name = "intel-daily"
version = "0.2.2"
description = "新能源每日情报薄控制层"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.20,<1",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2,<3",
    "pytest>=8.3,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intel_daily"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
